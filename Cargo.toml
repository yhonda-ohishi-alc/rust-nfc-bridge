[package]
name = "nfc-bridge"
version = "0.2.2"
edition = "2021"
description = "NFC reader bridge - reads card UIDs and broadcasts via WebSocket"

[[bin]]
name = "nfc-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
pcsc = "2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[profile.release]
opt-level = 2
lto = true
strip = true
